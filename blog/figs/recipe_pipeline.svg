<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1000" height="330" fill="white"/>
<text x="500" y="24" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">The recipe (harness/synth.py): from a model's layer structure to ranked rank-group layouts</text>
<rect x="20" y="60" width="150" height="90" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="1.4"/>
<text x="95.0" y="84.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">HF config.json</text>
<text x="95.0" y="98.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">heads, KV heads,</text>
<text x="95.0" y="111.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">SSM heads/groups,</text>
<text x="95.0" y="125.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">experts, layer order</text>
<line x1="170" y1="105" x2="196" y2="105" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="196" y="60" width="170" height="90" rx="6" fill="#eef3fb" stroke="#3b5b8c" stroke-width="1.4"/>
<text x="281.0" y="84.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">template</text>
<text x="281.0" y="98.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">falcon_h1 (attn || mamba)</text>
<text x="281.0" y="111.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">parallel_residual (attn || mlp)</text>
<text x="281.0" y="125.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">sequential_hybrid (layer types)</text>
<line x1="366" y1="105" x2="392" y2="105" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="392" y="60" width="200" height="90" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4"/>
<text x="492.0" y="84.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">enumerate candidates</text>
<text x="492.0" y="98.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">R1 group &lt;= unit count (no replication)</text>
<text x="492.0" y="111.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">R2 summed branches: one all-reduce</text>
<text x="492.0" y="125.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">R3 balance inside each phase</text>
<line x1="592" y1="105" x2="618" y2="105" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="618" y="60" width="180" height="90" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
<text x="708.0" y="84.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">score each candidate</text>
<text x="708.0" y="98.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">bytes per rank per phase /</text>
<text x="708.0" y="111.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">microbench bandwidth curve</text>
<text x="708.0" y="125.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">+ measured all-reduce cost</text>
<line x1="798" y1="105" x2="824" y2="105" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="824" y="60" width="160" height="90" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
<text x="904.0" y="84.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">ranked layouts</text>
<text x="904.0" y="98.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">tp4 / tp4_fused /</text>
<text x="904.0" y="111.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">split22 / split13 / ...</text>
<text x="904.0" y="125.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">step = sum of phase maxima</text>
<line x1="904" y1="150" x2="904" y2="180" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="560" y="180" width="424" height="60" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="1.4"/>
<text x="772.0" y="203.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">the harness measures the top candidates against tp4 on vLLM's kernels</text>
<text x="772.0" y="216.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">(same weights, same kernels, same NCCL groups; fp32 reference check first)</text>
<text x="20" y="215" font-size="11.5" text-anchor="start" fill="#222" font-weight="bold">Rules are measured effects, not assumptions:</text>
<text x="20" y="236" font-size="10.5" text-anchor="start" fill="#222">R1  replicated KV heads cost bandwidth every step (7B: 2 KV heads at 4 ranks, both replicas read the head)</text>
<text x="20" y="254" font-size="10.5" text-anchor="start" fill="#222">R2  o_proj and out_proj partials are summed anyway, so one all-reduce of the scaled sum replaces two (tp4_fused)</text>
<text x="20" y="272" font-size="10.5" text-anchor="start" fill="#222">R3  every all-reduce is a barrier: the step is sum over phases of the slowest group, so work moves only within a phase</text>
<text x="20" y="300" font-size="10.5" text-anchor="start" fill="#444" font-style="italic">Homogeneous TP is just the candidate where every group is the whole world; the recipe says 'tp4' for Falcon-40B.</text>
</svg>
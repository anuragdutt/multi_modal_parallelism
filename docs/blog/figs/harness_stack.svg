<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1000" height="300" fill="white"/>
<text x="500" y="24" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">Measurement stack (stage 1): a 4-rank layer harness on vLLM's own kernels and collectives</text>
<rect x="20" y="50" width="300" height="60" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="1.4"/>
<text x="170.0" y="66.5" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">docker image mmp:stage1</text>
<text x="170.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5">vllm/vllm-openai:v0.30.0 + editable clone of v0.30.0</text>
<text x="170.0" y="93.5" text-anchor="middle" dominant-baseline="middle" font-size="10.5">(compiled ops copied into the tree)</text>
<rect x="340" y="50" width="320" height="60" rx="6" fill="#eef3fb" stroke="#3b5b8c" stroke-width="1.4"/>
<text x="500.0" y="66.5" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">harness/ (torchrun, 4 ranks)</text>
<text x="500.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5">sharding.py: who owns which heads/columns</text>
<text x="500.0" y="93.5" text-anchor="middle" dominant-baseline="middle" font-size="10.5">layer.py: one decoder layer per mode</text>
<rect x="680" y="50" width="300" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
<text x="830.0" y="66.5" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">vLLM kernels, unmodified</text>
<text x="830.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5">paged FA2 decode, causal_conv1d_update,</text>
<text x="830.0" y="93.5" text-anchor="middle" dominant-baseline="middle" font-size="10.5">selective_state_update, rms_norm_gated, silu_and_mul</text>
<rect x="20" y="130" width="300" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
<text x="170.0" y="146.5" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">vLLM distributed groups</text>
<text x="170.0" y="160.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5">init_distributed_environment + initialize_model_parallel</text>
<text x="170.0" y="173.5" text-anchor="middle" dominant-baseline="middle" font-size="10.5">4-rank TP group, 2-rank pair groups (pynccl)</text>
<rect x="340" y="130" width="320" height="60" rx="6" fill="#eef3fb" stroke="#3b5b8c" stroke-width="1.4"/>
<text x="500.0" y="146.5" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">measure.py</text>
<text x="500.0" y="160.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5">20 warm + 100 timed steps, CUDA events per op (eager)</text>
<text x="500.0" y="173.5" text-anchor="middle" dominant-baseline="middle" font-size="10.5">+ CUDA-graph capture of the whole step (headline)</text>
<rect x="680" y="130" width="300" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
<text x="830.0" y="146.5" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">correctness.py / reference.py</text>
<text x="830.0" y="160.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5">fp32 pure-torch layer; every mode must match</text>
<text x="830.0" y="173.5" text-anchor="middle" dominant-baseline="middle" font-size="10.5">(mean rel err &lt;= 1.5e-2, cos &gt;= 0.9999) before a sweep</text>
<rect x="20" y="210" width="460" height="60" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4"/>
<text x="250.0" y="233.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">outputs: results/&lt;model&gt;/raw/*.csv (per op, per rank, per repeat)</text>
<text x="250.0" y="246.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">analysis/make_all.py: min over repeats + CoV flags, figures, summary.md</text>
<rect x="500" y="210" width="480" height="60" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="1.4"/>
<text x="740.0" y="233.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">hardware: guppy, 4x RTX A6000 48 GB, PCIe Gen4 only (no NVLink), shared box</text>
<text x="740.0" y="246.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">custom all-reduce disabled by vLLM on this topology, NCCL 2.30.7 for every collective</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1000" height="430" fill="white"/>
<text x="500" y="24" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">Falcon-H1-7B, 4 ranks: what each rank owns and reads per decode step</text>
<text x="220" y="50" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">rank 0</text>
<text x="435" y="50" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">rank 1</text>
<text x="650" y="50" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">rank 2</text>
<text x="865" y="50" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">rank 3</text>
<text x="14" y="80" font-size="13" text-anchor="start" fill="#222" font-weight="bold">tp4</text>
<text x="14" y="96" font-size="10" text-anchor="start" fill="#555">(vLLM)</text>
<rect x="120" y="62" width="200" height="118" rx="6" fill="#eef3fb" stroke="#3b5b8c" stroke-width="1.4"/>
<text x="220.0" y="87.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">q heads 0-2</text>
<text x="220.0" y="100.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">KV head 0  (replica 1 of 2)</text>
<text x="220.0" y="114.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">Mamba heads 0-5, B/C replicated</text>
<text x="220.0" y="127.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">MLP columns 1/4</text>
<text x="220.0" y="141.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">weights 79.4 MB</text>
<text x="220.0" y="154.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">reads full KV head: 512 B x B x c</text>
<rect x="335" y="62" width="200" height="118" rx="6" fill="#eef3fb" stroke="#3b5b8c" stroke-width="1.4"/>
<text x="435.0" y="87.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">q heads 3-5</text>
<text x="435.0" y="100.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">KV head 0  (replica 2 of 2)</text>
<text x="435.0" y="114.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">Mamba heads 6-11, B/C replicated</text>

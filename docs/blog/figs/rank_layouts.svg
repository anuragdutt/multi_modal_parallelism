<text x="435.0" y="154.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">reads full KV head: 512 B x B x c</text>
<rect x="550" y="62" width="200" height="118" rx="6" fill="#eef3fb" stroke="#3b5b8c" stroke-width="1.4"/>
<text x="650.0" y="87.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">q heads 6-8</text>
<text x="650.0" y="100.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">KV head 1  (replica 1 of 2)</text>
<text x="650.0" y="114.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">Mamba heads 12-17, B/C replicated</text>
<text x="650.0" y="127.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">MLP columns 1/4</text>
<text x="650.0" y="141.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">weights 79.4 MB</text>
<text x="650.0" y="154.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">reads full KV head: 512 B x B x c</text>
<rect x="765" y="62" width="200" height="118" rx="6" fill="#eef3fb" stroke="#3b5b8c" stroke-width="1.4"/>
<text x="865.0" y="87.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">q heads 9-11</text>
<text x="865.0" y="100.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">KV head 1  (replica 2 of 2)</text>
<text x="865.0" y="114.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">Mamba heads 18-23, B/C replicated</text>

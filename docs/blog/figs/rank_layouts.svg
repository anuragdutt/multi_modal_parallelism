<text x="500" y="200" font-size="10.5" text-anchor="middle" fill="#c0392b">aggregate KV traffic = 2x what the model needs: both replicas of a head read all of it every step; 4 four-rank all-reduces per layer</text>
<text x="14" y="250" font-size="13" text-anchor="start" fill="#222" font-weight="bold">split22</text>
<rect x="120" y="232" width="200" height="118" rx="6" fill="#e8f4ea" stroke="#2e7d32" stroke-width="1.4"/>
<text x="220.0" y="257.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">attention group</text>
<text x="220.0" y="270.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">q heads 0-5</text>
<text x="220.0" y="284.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">KV head 0  (no replica)</text>
<text x="220.0" y="297.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">MLP columns 1/4</text>
<text x="220.0" y="311.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">weights 67.6 MB</text>
<text x="220.0" y="324.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">reads 512 B x B x c of KV, no SSM state</text>
<rect x="335" y="232" width="200" height="118" rx="6" fill="#e8f4ea" stroke="#2e7d32" stroke-width="1.4"/>
<text x="435.0" y="257.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">attention group</text>
<text x="435.0" y="270.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">q heads 6-11</text>
<text x="435.0" y="284.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">KV head 1  (no replica)</text>
<text x="435.0" y="297.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">MLP columns 1/4</text>
<text x="435.0" y="311.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">weights 67.6 MB</text>
<text x="435.0" y="324.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">reads 512 B x B x c of KV, no SSM state</text>
<rect x="550" y="232" width="200" height="118" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.4"/>
<text x="650.0" y="257.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">Mamba group</text>
<text x="650.0" y="270.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">Mamba heads 0-11</text>
<text x="650.0" y="284.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">B/C replicated on the pair</text>
<text x="650.0" y="297.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">MLP columns 1/4</text>
<text x="650.0" y="311.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">weights 88.2 MB</text>
<text x="650.0" y="324.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">reads 1.57 MB x B of state, no KV</text>
<rect x="765" y="232" width="200" height="118" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.4"/>
<text x="865.0" y="257.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="bold">Mamba group</text>
<text x="865.0" y="270.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">Mamba heads 12-23</text>
<text x="865.0" y="284.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">B/C replicated on the pair</text>
<text x="865.0" y="297.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">MLP columns 1/4</text>
<text x="865.0" y="311.25" text-anchor="middle" dominant-baseline="middle" font-size="10.5">weights 88.2 MB</text>
<text x="865.0" y="324.75" text-anchor="middle" dominant-baseline="middle" font-size="10.5">reads 1.57 MB x B of state, no KV</text>
<text x="500" y="372" font-size="10.5" text-anchor="middle" fill="#2e7d32">each rank carries one branch plus its MLP slice; KV traffic matches the model; 2 four-rank all-reduces + 1 pair all-reduce per layer</text>
<text x="500" y="400" font-size="10.5" text-anchor="middle" fill="#444" font-style="italic">Why this cannot be a static win everywhere: the attention branch grows with context, the Mamba branch does not, so the slower group changes with (batch, context).</text>
</svg>